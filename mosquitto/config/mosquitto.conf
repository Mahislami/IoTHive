# Default logging so container logs remain useful
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# Primary encrypted MQTT listener (TLS on 8883)
listener 8883
allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
acl_file /mosquitto/config/acl

# Encrypted WebSocket listener (TLS on 9883)
listener 9883
protocol websockets
allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
