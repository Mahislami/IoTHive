version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  mqtt-certs-init:
    image: alpine:3.19
    command: /bin/sh -c "apk add --no-cache bash openssl && cd /certs && ./generate-certs.sh"
    volumes:
      - ./mosquitto/certs:/certs
    restart: "no"
    logging:
      <<: *default-logging

  https-certs-init:
    image: alpine:3.19
    command: /bin/sh -c "apk add --no-cache openssl && cd /certs && ./generate-certs.sh"
    volumes:
      - ./certs/https:/certs
    restart: "no"
    logging:
      <<: *default-logging

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./mosquitto/certs:/certs
      - ./mosquitto/config:/mosquitto-config
    environment:
      MQTT_BROKER: mosquitto-broker
      MQTT_PORT: 8883
      MQTT_CA_CERT: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/backend-client.crt
      MQTT_CLIENT_KEY: /certs/backend-client.key
      MQTT_CERTS_DIR: /certs
      MOSQUITTO_ACL_PATH: /mosquitto-config/acl
      MQTT_CERT_GENERATE_SCRIPT: /certs/generate-certs.sh
      MQTT_DEVICE_CERT_PREFIX: device
    expose:
      - "8000"
    depends_on:
      - redis
      - mqtt-certs-init
      - mosquitto
    networks:
      - iothive-network
    logging:
      <<: *default-logging

  redis:
    image: redis:7
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - iothive-network
    logging:
      <<: *default-logging

  celery:
    build:
      context: ./backend
    command: celery -A iothive worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./mosquitto/certs:/certs
      - ./mosquitto/config:/mosquitto-config
    environment:
      MQTT_BROKER: mosquitto-broker
      MQTT_PORT: 8883
      MQTT_CA_CERT: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/backend-client.crt
      MQTT_CLIENT_KEY: /certs/backend-client.key
      MQTT_CERTS_DIR: /certs
      MOSQUITTO_ACL_PATH: /mosquitto-config/acl
      MQTT_CERT_GENERATE_SCRIPT: /certs/generate-certs.sh
      MQTT_DEVICE_CERT_PREFIX: device
    depends_on:
      - backend
      - redis
      - mqtt-certs-init
      - mosquitto
    networks:
      - iothive-network
    logging:
      <<: *default-logging

  # NEW: Celery Beat scheduler (triggers periodic tasks every 10s)
  celery-beat:
    build:
      context: ./backend
    command: celery -A iothive beat -l info
    volumes:
      - ./backend:/app
      - ./mosquitto/certs:/certs
      - ./mosquitto/config:/mosquitto-config
    environment:
      MQTT_BROKER: mosquitto-broker
      MQTT_PORT: 8883
      MQTT_CA_CERT: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/backend-client.crt
      MQTT_CLIENT_KEY: /certs/backend-client.key
      MQTT_CERTS_DIR: /certs
      MOSQUITTO_ACL_PATH: /mosquitto-config/acl
      MQTT_CERT_GENERATE_SCRIPT: /certs/generate-certs.sh
      MQTT_DEVICE_CERT_PREFIX: device
    depends_on:
      - backend
      - redis
      - mqtt-certs-init
    networks:
      - iothive-network
    logging:
      <<: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-broker
    expose:
      - "8883"
      - "9883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    depends_on:
      - mqtt-certs-init
    networks:
      - iothive-network
    logging:
      <<: *default-logging

  client:
    build: ./mqtt-client
    container_name: mqtt-client
    stdin_open: true
    tty: true
    volumes:
      - ./mosquitto/certs:/certs:ro
    networks:
      - iothive-network
    profiles:
      - tools
    depends_on:
      - mosquitto
      - mqtt-certs-init
    logging:
      <<: *default-logging

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    env_file:
      - .env
    environment:
      INFLUXD_TLS_CERT: /etc/ssl/influxdb/iothive.crt
      INFLUXD_TLS_KEY: /etc/ssl/influxdb/iothive.key
    entrypoint:
      - /usr/local/bin/wait-for-files.sh
      - /etc/ssl/influxdb/iothive.crt
      - /etc/ssl/influxdb/iothive.key
      - --
      - /entrypoint.sh
    command:
      - influxd
    expose:
      - "8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./certs/https:/etc/ssl/influxdb:ro
      - ./scripts/wait-for-files.sh:/usr/local/bin/wait-for-files.sh:ro
    networks:
      - iothive-network
    depends_on:
      - https-certs-init
    logging:
      <<: *default-logging

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    entrypoint:
      - /usr/local/bin/wait-for-files.sh
      - /etc/telegraf/https-certs/iothive.crt
      - --
      - /entrypoint.sh
    command:
      - telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./mosquitto/certs:/etc/telegraf/certs:ro
      - ./certs/https:/etc/telegraf/https-certs:ro
      - ./scripts/wait-for-files.sh:/usr/local/bin/wait-for-files.sh:ro
    networks:
      - iothive-network
    depends_on:
      - mqtt-certs-init
      - https-certs-init
      - mosquitto
      - influxdb
    logging:
      <<: *default-logging

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    env_file:
      - .env
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - iothive-network
    depends_on:
      - influxdb
    logging:
      <<: *default-logging

  nginx:
    image: nginx:1.25
    container_name: iothive-ingress
    depends_on:
      - backend
      - grafana
      - influxdb
      - https-certs-init
    entrypoint:
      - /usr/local/bin/wait-for-files.sh
      - /etc/nginx/certs/iothive.crt
      - /etc/nginx/certs/iothive.key
      - --
      - /docker-entrypoint.sh
    command:
      - nginx
      - -g
      - daemon off;
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd-grafana:/etc/nginx/.htpasswd-grafana:ro
      - ./nginx/.htpasswd-influxdb:/etc/nginx/.htpasswd-influxdb:ro
      - ./certs/https:/etc/nginx/certs:ro
      - ./scripts/wait-for-files.sh:/usr/local/bin/wait-for-files.sh:ro
    networks:
      - iothive-network
    logging:
      <<: *default-logging

#  frontend:
#    build:
#      context: ./frontend
#    ports:
#      - "3000:80"
#    depends_on:
#      - backend

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb_data:
  grafana_data:

networks:
  iothive-network:
    driver: bridge
