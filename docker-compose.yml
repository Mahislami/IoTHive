version: "3.9"

services:
  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mosquitto
    networks:
      - iothive-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - iothive-network

  celery:
    build:
      context: ./backend
    command: celery -A iothive worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - mosquitto
    networks:
      - iothive-network

  # NEW: Celery Beat scheduler (triggers periodic tasks every 10s)
  celery-beat:
    build:
      context: ./backend
    command: celery -A iothive beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - iothive-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iothive-network

  client:
    build: ./mqtt-client
    container_name: mqtt-client
    depends_on:
      - mosquitto
    stdin_open: true
    tty: true
    networks:
      - iothive-network
    profiles:
      - tools

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    env_file:
      - .env
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - iothive-network

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - iothive-network
    depends_on:
      - mosquitto
      - influxdb

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - iothive-network
    depends_on:
      - influxdb

  nginx:
    image: nginx:1.25
    container_name: iothive-ingress
    depends_on:
      - backend
      - grafana
      - influxdb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd-grafana:/etc/nginx/.htpasswd-grafana:ro
      - ./nginx/.htpasswd-influxdb:/etc/nginx/.htpasswd-influxdb:ro
    networks:
      - iothive-network

#  frontend:
#    build:
#      context: ./frontend
#    ports:
#      - "3000:80"
#    depends_on:
#      - backend

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb_data:
  grafana_data:

networks:
  iothive-network:
    driver: bridge
