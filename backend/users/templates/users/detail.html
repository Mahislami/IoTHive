{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-6 py-10">
  <div class="bg-[color:var(--surface)] border border-[color:var(--border)] rounded-2xl p-6">
    <h1 class="text-2xl font-bold">{{ u.username }}</h1>
    <p class="text-sm text-[color:var(--text-secondary)]">{{ u.email|default:"No email" }}</p>

    <div class="mt-6 grid sm:grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-xl border border-[color:var(--border)]">
        <div class="text-[color:var(--text-secondary)]">Role</div>
        <div class="mt-1 capitalize">{{ profile.role|default:"visitor" }}</div>
      </div>
      <div class="p-4 rounded-xl border border-[color:var(--border)]">
        <div class="text-[color:var(--text-secondary)]">Joined</div>
        <div class="mt-1">{{ u.date_joined|date:"Y-m-d H:i" }}</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
