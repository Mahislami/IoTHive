{% extends "base.html" %}
{% block title %}Delete Device{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-6 py-10">
  <div class="bg-[color:var(--surface)] border border-[color:var(--border)] rounded-2xl p-6">
    <h1 class="text-2xl font-bold mb-4">Delete {{ device.name }}?</h1>
    <p class="text-[color:var(--text-secondary)] mb-6">This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="px-4 py-2 bg-[color:var(--accent-error)] text-white rounded-lg">Delete</button>
      <a href="javascript:history.back()" class="ml-3 px-4 py-2 border border-[color:var(--border)] rounded-lg">Back</a>
      <a href="{% url 'home' %}" class="ml-3 px-4 py-2 border border-[color:var(--border)] rounded-lg">Home</a>
    </form>
  </div>
</div>
{% endblock %}
