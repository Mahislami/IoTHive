[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "iot_token"
  organization = "iot_org"
  bucket = "iot_bucket"

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto-broker:8883"]
  topics = [
    "iot/#",
    "home/#"
  ]
  qos = 0
  connection_timeout = "30s"
  persistent_session = false
  client_id = "telegraf"
  data_format = "json"
  tls_ca = "/etc/telegraf/certs/ca.crt"
  tls_cert = "/etc/telegraf/certs/telegraf-client.crt"
  tls_key = "/etc/telegraf/certs/telegraf-client.key"
  insecure_skip_verify = false
