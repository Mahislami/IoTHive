server {
    listen 80;
    server_name iothive-dashboard.com www.iothive-dashboard.com _;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name grafana.localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iothive-dashboard.com www.iothive-dashboard.com;

    ssl_certificate /etc/nginx/certs/iothive.crt;
    ssl_certificate_key /etc/nginx/certs/iothive.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # Django backend
    location / {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Serve Grafana under /grafana on the same domain
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # InfluxDB API (Basic Auth protected)
    location /influxdb/ {
        auth_basic "Restricted InfluxDB";
        auth_basic_user_file /etc/nginx/.htpasswd-influxdb;
        proxy_pass https://influxdb:8086/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    server_name grafana.localhost;

    ssl_certificate /etc/nginx/certs/iothive.crt;
    ssl_certificate_key /etc/nginx/certs/iothive.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
