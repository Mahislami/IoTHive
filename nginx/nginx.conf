server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Django backend
    location / {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Normalize /grafana -> /grafana/
    location = /grafana {
        return 301 /grafana/;
    }

    # Grafana via sub-path (Basic Auth protected)
    location /grafana/ {
        auth_basic "Restricted Grafana";
        auth_basic_user_file /etc/nginx/.htpasswd-grafana;
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /grafana;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_redirect off;
    }

    # InfluxDB API (Basic Auth protected)
    location /influxdb/ {
        auth_basic "Restricted InfluxDB";
        auth_basic_user_file /etc/nginx/.htpasswd-influxdb;
        proxy_pass http://influxdb:8086/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
